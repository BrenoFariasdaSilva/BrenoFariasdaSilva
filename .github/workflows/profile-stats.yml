name: Generate profile statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/profile-stats.yml', 'scripts/profile.py']
permissions:
  contents: write
concurrency:
  group: profile-readme-writers
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - run: mkdir -p "$RUNNER_TEMP/profile-cards"
      - name: Generate GitHub stats
        id: stats
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=tokyonight&card_width=500&include_all_commits=true
          path: ${{ runner.temp }}/profile-cards/github-stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          fail_on_error: 'true'
      - name: Generate language distribution
        id: languages
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=12&theme=tokyonight&hide_border=true&card_width=500
          path: ${{ runner.temp }}/profile-cards/top-languages.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          fail_on_error: 'true'
      - name: Generate contribution streak
        id: streak
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@74c6ece2c615b8efbbee6f39be302c74749eae45
        with:
          options: user=${{ github.repository_owner }}&theme=black-ice&hide_border=true
          path: ${{ runner.temp }}/profile-cards/streak.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
      - name: Generate trophies
        id: trophies
        continue-on-error: true
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        with:
          username: ${{ github.repository_owner }}
          output_path: ${{ runner.temp }}/profile-cards/trophies.svg
          theme: aura
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
      - name: Generate contribution graph and summary
        id: graph
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
          CARD_DIR: ${{ runner.temp }}/profile-cards
        run: python3 scripts/profile.py graph
      - name: Validate and publish available SVGs
        env:
          CARD_DIR: ${{ runner.temp }}/profile-cards
          STATS_OUTCOME: ${{ steps.stats.outcome }}
          LANGUAGES_OUTCOME: ${{ steps.languages.outcome }}
          STREAK_OUTCOME: ${{ steps.streak.outcome }}
          TROPHIES_OUTCOME: ${{ steps.trophies.outcome }}
          GRAPH_OUTCOME: ${{ steps.graph.outcome }}
          FAILED: ${{ steps.stats.outcome == 'failure' || steps.languages.outcome == 'failure' || steps.streak.outcome == 'failure' || steps.trophies.outcome == 'failure' || steps.graph.outcome == 'failure' }}
        run: |
          # A failed action must never publish even if it left a partial file.
          if [ "$STATS_OUTCOME" != success ]; then rm -f "$CARD_DIR/github-stats.svg"; fi
          if [ "$LANGUAGES_OUTCOME" != success ]; then rm -f "$CARD_DIR/top-languages.svg"; fi
          if [ "$STREAK_OUTCOME" != success ]; then rm -f "$CARD_DIR/streak.svg"; fi
          if [ "$TROPHIES_OUTCOME" != success ]; then rm -f "$CARD_DIR/trophies.svg"; fi
          if [ "$GRAPH_OUTCOME" != success ]; then rm -f "$CARD_DIR/activity.svg" "$CARD_DIR/analytics.svg"; fi
          python3 scripts/profile.py publish
          python3 scripts/profile.py validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md badges/wakatime.svg profile
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh generated statistics'
            git push origin HEAD:main
          fi
          if [ "$FAILED" = true ] || grep -q '^PROFILE_INVALID=true$' "$GITHUB_ENV"; then
            echo '::error::One or more cards failed to generate; last known good cards were retained.'
            exit 1
          fi
