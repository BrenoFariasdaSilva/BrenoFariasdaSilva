name: Validate profile images
on:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * *'
  push:
    branches: [main]
    paths: ['README.md', 'badges/**', 'profile/**', 'scripts/**', 'tests/**', '.github/workflows/validate-profile.yml']
  pull_request:
    paths: ['README.md', 'badges/**', 'profile/**', 'scripts/**', 'tests/**', '.github/workflows/validate-profile.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/profile.py validate
      - name: Check remote images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/profile.py validate --external
